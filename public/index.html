<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>콘텐츠 스튜디오</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#191D28">
</head>
<body>
  <header class="bar">
    <div class="brand"><img class="logo" src="/icons/favicon-32.png" alt=""><b>콘텐츠 스튜디오</b><span id="catChip" class="catchip" hidden></span> <span id="mockBadge" class="mock" hidden>테스트 모드</span></div>
    <nav class="tabs" role="tablist">
      <button data-tab="home" class="on">홈</button>
      <span class="flow" aria-label="글 쓰는 순서">
        <button data-tab="topics">주제 정하기 <i id="nTopics"></i></button><span class="arr" aria-hidden="true">›</span>
        <button data-tab="review">검수함 <i id="nReview"></i></button><span class="arr" aria-hidden="true">›</span>
        <button data-tab="publish">발행 <i id="nPublish"></i></button>
      </span>
      <span class="sep" aria-hidden="true"></span>
      <button data-tab="research">리서치 기록</button>
      <button data-tab="newsletter">뉴스레터</button>
      <button data-tab="feedback">피드백 <i id="nFeedback" class="soft"></i></button>
      <button data-tab="settings">설정 <i id="nSettings"></i></button>
    </nav>
  </header>
  <div id="hint"></div>
  <main id="view" aria-live="polite"></main>
  <div id="onb" class="modal onb" role="dialog" aria-modal="true" aria-labelledby="onbTitle" hidden></div>
  <div id="toast" role="status" hidden></div>
  <button id="fbFab" class="fab" type="button" aria-haspopup="dialog">의견 남기기</button>
  <div id="fbModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="fbTitle" hidden>
    <div class="modal-box">
      <h2 id="fbTitle">의견 남기기</h2>
      <p class="small muted">남긴 의견은 앞으로 만드는 글·주제·SNS에 가장 먼저 반영해요. 피드백 탭에서 끄거나 지울 수 있어요.</p>
      <label class="small muted" for="fbScope">어느 쪽 의견인가요?</label>
      <select id="fbScope"></select>
      <textarea id="fbText" placeholder="예: 비유는 직장 생활 예로 들어 줘. / 쓰레드는 더 짧게."></textarea>
      <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="fbCancel">닫기</button><button class="btn primary" type="button" id="fbSave">저장</button></div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
